<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEL DISTRIBUTOR</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:#131417; color:#E8EAED;
         font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif; }
  .box { max-width:600px; padding:40px 32px; text-align:center; }
  h1 { font-size:20px; margin:0 0 10px; letter-spacing:.02em; }
  p  { color:#9AA0A6; font-size:14px; line-height:1.7; margin:0 0 20px; }
  .u { background:#232428; border:1px solid #2C2E33; border-radius:8px;
       padding:14px; font:12px/1.6 Consolas,monospace; color:#C9CDD3;
       word-break:break-all; text-align:left; margin-bottom:18px; }
  button { border:0; border-radius:8px; padding:11px 22px; font-size:14px;
           font-weight:700; cursor:pointer; margin:0 4px; }
  .go   { background:#3B82F6; color:#fff; }
  .go:hover { background:#2563EB; }
  .ghost{ background:#232428; color:#C9CDD3; border:1px solid #3A3D44; }
  .msg  { min-height:20px; font-size:13px; color:#60A5FA; margin-top:14px; }
  .links{ margin-top:30px; font-size:12px; color:#6B7076; }
  .links a { color:#60A5FA; text-decoration:none; margin:0 8px; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="box">
  <h1>MEL DISTRIBUTOR</h1>

  <div id="auto">
    <p>로그인이 끝났습니다.<br><b id="cnt">2</b>초 뒤 프로그램으로 자동 전달합니다.</p>
    <button class="ghost" onclick="cancelAuto()">직접 복사할래요</button>
  </div>

  <div id="manual" class="hide">
    <p>아래 주소를 복사해서 프로그램의
       <b>[로그인 후 리다이렉트된 전체 주소]</b> 칸에 붙여 넣으세요.</p>
    <div class="u" id="url">-</div>
    <button class="go" onclick="copyUrl()">주소 복사</button>
    <button class="ghost" onclick="sendNow()">프로그램으로 보내기</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="links">
    <a href="./privacy.html">개인정보처리방침</a>·
    <a href="./terms.html">이용약관</a>
  </div>
</div>

<script>
  var full  = location.href;
  var qs    = location.search || "";
  var hasCode = qs.indexOf("code=") >= 0;
  var timer = null;

  document.getElementById("url").textContent = full;

  function showManual() {
    document.getElementById("auto").className = "hide";
    document.getElementById("manual").className = "";
  }
  function cancelAuto() {
    if (timer) { clearInterval(timer); timer = null; }
    showManual();
  }
  function sendNow() {
    location.href = "http://127.0.0.1:8770/callback" + qs;
  }
  function copyUrl() {
    navigator.clipboard.writeText(full).then(function () {
      document.getElementById("msg").textContent = "복사했습니다.";
    }, function () {
      document.getElementById("msg").textContent = "직접 드래그해서 복사해 주세요.";
    });
  }

  // PC 에서 로그인했으면 프로그램이 127.0.0.1 에서 기다리고 있다. 거기로 넘긴다.
  // 폰으로 로그인했거나 프로그램이 안 떠 있으면 실패하는데,
  // 그때는 뒤로가기를 누르면 이 화면으로 돌아와 직접 복사하면 된다.
  if (hasCode) {
    var n = 2;
    timer = setInterval(function () {
      n -= 1;
      document.getElementById("cnt").textContent = n;
      if (n <= 0) { clearInterval(timer); timer = null; sendNow(); }
    }, 1000);
  } else {
    showManual();
  }
</script>
</body>
</html>
